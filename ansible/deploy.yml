- name: Desplegar aplicación en Kubernetes K3s
  hosts: localhost
  connection: local
  tasks:
    - name: Validar entorno solicitado
      ansible.builtin.assert:
        that:
          - env is defined
          - env in ['qa', 'prd']
          - web_image is defined
          - web_image | length > 0
        fail_msg: "El entorno debe ser 'qa' o 'prd'."

    - name: Asegurar namespace del entorno
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ env }}"

    - name: Renderizar manifiesto Kubernetes del entorno
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/deploy-{{ 'qa.yml' if env == 'qa' else 'prd.yaml' }}"
        dest: "/tmp/deploy-{{ env }}.yaml"
        mode: "0600"

    - name: Aplicar manifiesto Kubernetes
      kubernetes.core.k8s:
        state: present
        src: "/tmp/deploy-{{ env }}.yaml"