global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: nginx-qa
    static_configs:
      - targets: ['k3s-server:30083']
        labels:
          environment: qa

  - job_name: nginx-prd
    static_configs:
      - targets: ['k3s-server:30084']
        labels:
          environment: prd

  # Blackbox probes check HTTP availability; the NodePort apps do not expose
  # Prometheus metrics themselves, and Jenkins /metrics requires authorization.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://jenkins:8080/login
          - http://k3s-server:30081/
          - http://k3s-server:30082/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115