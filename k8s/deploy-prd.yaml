apiVersion: v1
kind: Namespace
metadata:
  name: prd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-prd
  namespace: prd
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-prd
  template:
    metadata:
      labels:
        app: web-prd
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true
        - name: web-content
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.4.2
        args:
        - --nginx.scrape-uri=http://127.0.0.1:8080/stub_status
        ports:
        - containerPort: 9113
          name: metrics
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9113
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: web-content
        configMap:
          name: web-site
---
apiVersion: v1
kind: Service
metadata:
  name: web-prd-service
  namespace: prd
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30082
  selector:
    app: web-prd
---
apiVersion: v1
kind: Service
metadata:
  name: web-prd-metrics
  namespace: prd
  labels:
    app: web-prd
    component: metrics
spec:
  type: NodePort
  ports:
  - name: metrics
    port: 9113
    targetPort: metrics
    nodePort: 30084
  selector:
    app: web-prd